<div class="container">

  <h1>📚 Моя бібліотека</h1>

  <div class="form">

    <h2>Додати книгу</h2>

    <input
      type="text"
      placeholder="Назва книги"
      [(ngModel)]="title"
    >

    <input
      type="text"
      placeholder="Автор"
      [(ngModel)]="author"
    >

    <input
      type="number"
      placeholder="Кількість сторінок"
      [(ngModel)]="pages"
    >

    <button (click)="addBook()">
      Додати книгу
    </button>

  </div>

  <h2>Список книг</h2>

  @for (book of books; track book.id) {

    <div class="book">

      <h3>{{ book.title }}</h3>

      <p>Автор: {{ book.author }}</p>

      <p>Сторінок: {{ book.pages }}</p>

      <button
        class="delete"
        (click)="removeBook(book.id)"
      >
        Видалити
      </button>

    </div>

  }

</div>
