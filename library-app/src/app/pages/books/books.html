
<h2>Каталог книг</h2>

<div class="books">
  <article class="book-card" *ngFor="let book of books">
    <h3>{{ book.title }}</h3>
    <p><strong>Автор:</strong> {{ book.author }}</p>
    <p>{{ book.description }}</p>
    <a [routerLink]="['/book', book.id]" class="button">Детальніше</a>
  </article>
</div>

<p *ngIf="books.length === 0">Книг поки немає.</p>
